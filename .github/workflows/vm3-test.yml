name: BLACKMAMER Native VM V3 Luau

on:
  push:
    branches:
      - feature/blackmamer-native-vm-v3
      - feature/vm3-per-function-polymorphism-v32
      - feature/vm3-opaque-bytecode-v31
      - fix/vm3-shard-dispatch-degenerate
      - feature/vm3-buffer-prototypes-v33
      - feature/vm3-superinstructions-v34
      - feature/native-v3-generic-for-multireturn-saweria
      - fix/nativev3-cinematic-syntax-diagnostics
      - fix/nativev3-function-multireturn-cinematic
      - feature/vm3-shuffled-alphabet-blob-encoding
      - feature/vm3-polymorphic-dispatch-iter-20261110
      - feature/nativev3-lazy-constant-pool-20261110
      - feature/nativev3-hybrid-sbox-layout-20261110
      - feature/nativev3-single-line-output-20261110
      - main
    paths:
      - 'blackmamer-vm3.js'
      - 'lua-output-compact.js'
      - 'tests/vm3-compact-output.js'
      - 'tests/vm3-luau.js'
      - 'tests/vm3-multireturn-cinematic-luau.js'
      - 'tests/vm3-cinematic-luau.js'
      - 'tests/vm3-saweria-luau.js'
      - 'tests/fixtures/**'
      - 'tests/vm3-dispatch.js'
      - 'tests/vm3-user-patterns.js'
      - 'tests/vm3-superinstructions.js'
      - '.github/workflows/vm3-test.yml'
      - 'server.js'
      - 'tests/vm3-api.js'
  pull_request:
    paths:
      - 'blackmamer-vm3.js'
      - 'lua-output-compact.js'
      - 'tests/vm3-compact-output.js'
      - 'tests/vm3-luau.js'
      - 'tests/vm3-multireturn-cinematic-luau.js'
      - 'tests/vm3-cinematic-luau.js'
      - 'tests/vm3-saweria-luau.js'
      - 'tests/fixtures/**'
      - '.github/workflows/vm3-test.yml'
      - 'server.js'
      - 'tests/vm3-api.js'

jobs:
  native-vm-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --omit=dev
      # V3 API is retired; V3 compiler-only tests below still run.
      - name: Compile entire user Donation Cinematic source
        run: node -e "const fs=require('node:fs');const vm=require('./blackmamer-vm3');const src=fs.readFileSync('tests/fixtures/bm-saweria-donation-cinematic.luau','utf8');const out=vm.compile(src);if(out.vmInstructions<300)process.exit(1);console.log('Exact Cinematic compiled '+out.vmInstructions+' VM instructions')"
      - name: Compile full user BM Saweria GUI script (syntax regression)
        run: node -e "const fs=require('fs');const vm=require('./blackmamer-vm3');const src=fs.readFileSync('tests/fixtures/bm-saweria-fake-donate-client.luau','utf8');const out=vm.compile(src);if(!out.code.includes('BLACKMAMER'))process.exit(1);console.log('BM Saweria compile OK',out.vmInstructions,'VM instructions')"
      - name: Verify one-line NativeV3 output and lexical safety
        run: node tests/vm3-compact-output.js
      - name: Verify nondegenerate opcode dispatcher across 160 builds
        run: node tests/vm3-dispatch.js
      - name: Verify fused opcode compiler across 630 randomized builds
        run: node tests/vm3-superinstructions.js
  native-vm-luau:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official Luau CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
          git clone --depth 1 https://github.com/luau-lang/luau.git luau-src
          cmake -S luau-src -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Repl.CLI --parallel 2
      - name: Run independent V3 VM and guards against Luau
        env:
          LUAU_BIN: ./luau-build/luau
        run: node tests/vm3-luau.js
      - name: Compare 3 user-script feature groups against official Luau
        env:
          LUAU_BIN: ./luau-build/luau
        run: node tests/vm3-user-patterns.js
      - name: Compare compound assignment and continue semantics against Luau
        env:
          LUAU_BIN: ./luau-build/luau
        run: node tests/vm3-cinematic-luau.js
      - name: Compare exact Donation Cinematic and multi-value returns against official Luau
        env:
          LUAU_BIN: ./luau-build/luau
        run: node tests/vm3-multireturn-cinematic-luau.js
      - name: Compare full BM Saweria GUI script with Native VM3 and Luau CLI
        env:
          LUAU_BIN: ./luau-build/luau
        run: node tests/vm3-saweria-luau.js
