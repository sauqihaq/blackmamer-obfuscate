name: BLACKMAMER Prometheus Double VM Compatibility Probe
on:
  pull_request:
    paths:
      - 'tests/double-vm-probe.js'
      - 'tests/double-vm-runtime.js'
      - 'tests/double-vm-perf.js'
      - '.github/workflows/double-vm-probe.yml'
      - 'blackmamer-vm3.js'
      - 'prometheus-stage.js'
      - 'prometheus-maximal.lua'
      - 'tests/prometheus-full-probe.js'
      - 'tests/prometheus-full-runtime.js'
      - 'tests/prometheus-semantic-isolate.js'
      - 'full-prometheus-pipeline.js'
      - 'tests/prometheus-full-isolate.js'
      - 'server.js'
      - 'Dockerfile'
  workflow_dispatch:
jobs:
  compatibility-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - name: Pin upstream Prometheus source
        run: |
          mkdir -p vendor/prometheus
          git -C vendor/prometheus init -q
          git -C vendor/prometheus remote add origin https://github.com/prometheus-lua/Prometheus.git
          git -C vendor/prometheus fetch -q --depth 1 origin a98c50165f2a53f6d765a82eee60dfea53803445
          git -C vendor/prometheus checkout -q --detach FETCH_HEAD
      - name: Probe every Prometheus feature before outer BLACKMAMER
        run: node tests/prometheus-full-probe.js
      - name: Evaluate real double VM compiler pipeline
        run: node tests/double-vm-probe.js
      - name: Profile source vs Prometheus vs DOUBLE VM
        run: node tests/double-vm-perf.js
      - name: Diagnose Prometheus inner multi-return nil parity
        run: node tests/prometheus-semantic-isolate.js
      - name: Real all-feature Lua 5.1 and LuaJIT parity
        env:
          FULL_TEST_LUAJIT: '1'
          BLACKMAMER_FULL_DIAGNOSTIC: '1'
        run: node tests/prometheus-full-runtime.js
      - name: Real Lua 5.1 and LuaJIT double-VM execution parity
        env:
          DOUBLE_VM_TEST_LUAJIT: '1'
        run: node tests/double-vm-runtime.js
