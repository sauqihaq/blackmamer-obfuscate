name: Live BLACKMAMER Cinematic Syntax Diagnostics
on:
  push:
    branches:
      - test/live-netlify-render-20261110
    paths:
      - 'tests/live-cinematic-syntax-20261110.js'
      - '.github/workflows/live-cinematic-syntax-20261110.yml'
  workflow_dispatch:
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live Render cinematic syntax and detailed failure
        run: node tests/live-cinematic-syntax-20261110.js
