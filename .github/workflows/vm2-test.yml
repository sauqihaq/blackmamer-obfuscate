name: BLACKMAMER VM Luau verification

on:
  push:
    branches:
      - main
      - feature/blackmamer-hybrid-vm-v2
  pull_request:
    paths:
      - 'blackmamer-vm2.js'
      - 'blackmamer-vm.js'
      - 'server.js'
      - 'tests/**'
      - 'test-vm2.js'
      - 'package.json'
      - '.github/workflows/vm2-test.yml'

jobs:
  vm2-lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Test register VM semantics
        run: npm test

  # Archived VM2 compiler tests remain available without bundling Prometheus.
