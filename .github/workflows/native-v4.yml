name: BLACKMAMER Native V4 C++ + Luau

on:
  pull_request:
    paths:
      - 'blackmamer-vm3.js'
      - 'vm7-independent.js'
      - 'tests/vm4-seven-independent.js'
      - 'native/**'
      - 'native-sealer.js'
      - 'protected-functions.js'
      - 'runtime-key-vault.js'
      - 'tests/runtime-key-vault.js'
      - 'tests/vm4-remote-luau.js'
      - 'tests/vm4-remote-postgres.js'
      - 'tests/vm4-external-keys.js'
      - 'tests/vm4-external-luau.js'
      - 'server.js'
      - 'Dockerfile'
      - 'netlify-frontend/**'
      - 'tests/native-sealer.js'
      - 'tests/vm4-luau.js'
      - 'tests/vm4-lua51.js'
      - 'tests/vm4-only-api.js'
      - 'tests/vm4-structural-audit.js'
      - 'tests/vm4-binding-hardening.js'
      - '.github/workflows/native-v4.yml'
  push:
    branches: [main, feature/native-v4-cpp-hardening]
    paths:
      - 'blackmamer-vm3.js'
      - 'native/**'
      - 'native-sealer.js'
      - 'protected-functions.js'
      - 'tests/vm4-external-keys.js'
      - 'tests/vm4-external-luau.js'
      - 'server.js'
      - 'Dockerfile'
      - 'netlify-frontend/**'
      - 'tests/native-sealer.js'
      - 'tests/vm4-luau.js'
      - 'tests/vm4-structural-audit.js'
      - '.github/workflows/native-v4.yml'

jobs:
  native-v4-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blackmamer
          POSTGRES_USER: blackmamer
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify compiler and frontend syntax
        run: |
          node --check blackmamer-vm3.js
          node --check vm7-independent.js
          node --check native-sealer.js
          node --check protected-functions.js
          node --check runtime-key-vault.js
          node tests/vm4-external-keys.js
          node tests/vm4-structural-audit.js
          node tests/vm4-binding-hardening.js
          node --check server.js
          node tests/frontend-smoke.js
      - name: Build native C++17 sealer (warnings treated as errors)
        run: g++ -O2 -std=c++17 -Wall -Wextra -Werror native/sealer.cpp -o native/bm-sealer
      - name: Compare C++ with JavaScript fallback across randomized batches
        run: node tests/native-sealer.js
      - name: Run regression suites and V3/V4 API integration
        run: |
          npm install --omit=dev
          node tests/runtime-key-vault.js
          node tests/vm4-only-api.js
          node tests/vm4-remote-postgres.js
      - name: Docker build including C++ native binary
        run: docker build -t blackmamer-native-v4 .

  native-v4-luau:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile official Luau CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make lua5.1 luajit
          git clone --depth 1 https://github.com/luau-lang/luau.git luau-src
          cmake -S luau-src -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Repl.CLI --parallel 2
      - name: Build native sealer for official Luau runtime tests
        run: g++ -O2 -std=c++17 -Wall -Wextra -Werror native/sealer.cpp -o native/bm-sealer
      - name: Run hardened V4 execution and tamper regression
        env:
          LUAU_BIN: ./luau-build/luau
        run: |
          node tests/vm4-luau.js
          node tests/vm4-external-luau.js
          node tests/vm4-remote-luau.js
          node tests/vm4-lua51.js
